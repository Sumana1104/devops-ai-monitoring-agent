apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot
  namespace: opspilot
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: opspilot
  template:
    metadata:
      labels:
        app: opspilot
    spec:
      containers:
        - name: opspilot
          # The deployment job substitutes the tested image before applying.
          image: opspilot:bootstrap
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opspilot-api
                  key: GROQ_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
