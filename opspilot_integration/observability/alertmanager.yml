global:
  resolve_timeout: 1m
route:
  receiver: local-opspilot
  group_by: [alertname]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 30m
receivers:
  - name: local-opspilot
    webhook_configs:
      - url: http://host.docker.internal:18008/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/opspilot-alert-token
inhibit_rules:
  - source_matchers:
      - 'alertname=~"OpsPilotDemoOOMKilled|OpsPilotDemoCrashLoopBackOff|OpsPilotDemoFailedScheduling"'
    target_matchers:
      - 'alertname="OpsPilotDemoMetricsDown"'
    equal: [service]
