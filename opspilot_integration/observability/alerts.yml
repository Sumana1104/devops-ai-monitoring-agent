groups:
  - name: opspilot-demo
    rules:
      - alert: OpsPilotDemoOOMKilled
        expr: |
          (opspilot_demo_oom_active{job="opspilot-kubernetes"} == 1)
          and on(job, instance, service) (opspilot_kubernetes_evidence_available == 1)
          and on(job, instance) (up{job="opspilot-kubernetes"} == 1)
        for: 10s
        labels:
          severity: high
          service: opspilot-demo
        annotations:
          summary: "Current demo container has Kubernetes OOMKilled/137 evidence"
          description: "Investigate real current state; memory-limit mitigation requires fresh evidence and human approval"
      - alert: OpsPilotDemoCrashLoopBackOff
        expr: |
          (opspilot_demo_crash_active{job="opspilot-kubernetes"} == 1)
          and on(job, instance, service) (opspilot_kubernetes_evidence_available == 1)
          and on(job, instance) (up{job="opspilot-kubernetes"} == 1)
        for: 10s
        labels:
          severity: high
          service: opspilot-demo
        annotations:
          summary: "Current demo container has an Error CrashLoopBackOff"
          description: "Use actual logs and Kubernetes identities; never restart from a metric alone"
      - alert: OpsPilotDemoFailedScheduling
        expr: |
          (opspilot_demo_unschedulable{job="opspilot-kubernetes"} == 1)
          and on(job, instance, service) (opspilot_kubernetes_evidence_available == 1)
          and on(job, instance) (up{job="opspilot-kubernetes"} == 1)
        for: 20s
        labels:
          severity: high
          service: opspilot-demo
        annotations:
          summary: "Current demo Pod is Unschedulable"
          description: "Read same-Pod scheduler events; manual review only, not a fourth remediation scenario"
      - alert: OpsPilotDemoReadinessFailure
        expr: |
          (opspilot_demo_ready{job="opspilot-demo"} == 0)
          and on(job, instance) (up{job="opspilot-demo"} == 1)
        for: 20s
        labels:
          severity: high
          service: opspilot-demo
        annotations:
          summary: "OpsPilot demo readiness flag active while metrics still scrape"
          description: "Verify live readiness/liveness HTTP, Pod ownership and Service endpoints; never restart blindly"
      - alert: OpsPilotHighErrorRate
        expr: |
          (
            sum(rate(opspilot_http_requests_total{status=~"5.."}[1m]))
            /
            clamp_min(sum(rate(opspilot_http_requests_total[1m])), 0.001)
          ) > 0.08
          and sum(rate(opspilot_http_requests_total[1m])) > 0.1
        for: 20s
        labels:
          severity: high
          service: opspilot-demo
        annotations:
          summary: "OpsPilot demo HTTP 5xx error-rate spike"
          description: "The demo app generated more than 8% HTTP 5xx over a minute"
      - alert: OpsPilotHighLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (
            rate(opspilot_http_request_duration_seconds_bucket[1m])
          )) > 0.4
        for: 20s
        labels:
          severity: medium
          service: opspilot-demo
        annotations:
          summary: "OpsPilot demo HTTP p95 latency spike"
          description: "The observed HTTP p95 duration exceeded 400ms"
      - alert: OpsPilotDemoMetricsDown
        expr: up{job="opspilot-demo"} == 0
        for: 30s
        labels:
          severity: high
          service: opspilot-demo
        annotations:
          summary: "OpsPilot demo metric target unreachable"
          description: "Prometheus cannot scrape the demo app; investigate networking/pod health"
