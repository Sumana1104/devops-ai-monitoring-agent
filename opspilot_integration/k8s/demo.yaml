apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot-demo
  namespace: opspilot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opspilot-demo
  template:
    metadata:
      labels:
        app: opspilot-demo
    spec:
      volumes:
        - name: ephemeral-demo-state
          emptyDir: {}
      containers:
        - name: opspilot-demo
          image: opspilot-demo:v1-final-1
          imagePullPolicy: Never
          # Persistent only while this pod exists. A human-approved rollout
          # creates a fresh pod and clears the intentional crash flag.
          command: ["/bin/sh", "-c"]
          args:
            - 'if [ -f /runtime/crash.flag ]; then echo "Intentional demo CrashLoopBackOff"; exit 1; fi; exec uvicorn app:app --host 0.0.0.0 --port 8080'
          volumeMounts:
            - name: ephemeral-demo-state
              mountPath: /runtime
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: opspilot-demo
  namespace: opspilot
spec:
  selector:
    app: opspilot-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
