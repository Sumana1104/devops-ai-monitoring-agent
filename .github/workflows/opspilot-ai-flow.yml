name: OpsPilot AI flow tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight test dependencies
        run: python -m pip install -r opspilot_integration/requirements-ai-flow-test.txt
      - name: Offline integration tests (no secrets or paid APIs)
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Compile graph and bridge source
        run: python -m compileall -q ai_service/app api_service/app opspilot_integration
